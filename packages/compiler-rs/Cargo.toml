[workspace]
members = ["crates/*"]

[package]
name = "barq_compiler"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
barq_css = { path = "crates/barq-css" }
napi = { version = "3.14.2", default-features = false, features = ["napi4", "dyn-symbols"] }
napi-derive = "3.6.12"
oxc = { version = "0.154.0", features = ["ast_visit", "codegen", "semantic"] }
oxc_index = "5.0.0"
# The same crate `oxc_codegen` returns its map in; named directly because the
# `oxc` facade does not re-export it, and §6's template-interior segments have
# to be merged into that map rather than into a second one.
oxc_sourcemap = "9.0.0"
rustc-hash = "2.1.3"

[build-dependencies]
napi-build = "2.6.0"

# Its own `main`: the allocation counter it reads is process-wide.
[[test]]
name = "compile_work"
harness = false

[profile.release]
lto = true
strip = "symbols"
