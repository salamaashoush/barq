# Bun configuration for @barqjs/router
# https://bun.sh/docs/runtime/bunfig

[test]
root = "./src"

# happy-dom plus the barq compiler, so a `.tsx` test reaches the runtime through
# the same emission an application does.
preload = ["./src/test-setup.ts"]

coverage = false
timeout = 10000
smol = true

[install]
frozen = false
peer = true

[run]
silent = false
