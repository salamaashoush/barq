# Bun configuration for @barqjs/start
# https://bun.sh/docs/runtime/bunfig

[test]
# BOTH halves. `root = "./src"` hid `test/dev-server.test.ts` — six passing tests
# through a real Vite dev server on a real socket — from every gate that runs
# `bun test`, and the package's headline number read 36 for a suite of 42.
root = "."

# Coverage settings
coverage = true
coverageDir = "./coverage"

# Timeout per test (ms)
timeout = 10000

# Run tests in parallel
smol = true

[install]
# Don't freeze lockfile during development
frozen = false

# Auto-install peer dependencies
peer = true

[run]
# Show output from scripts
silent = false
