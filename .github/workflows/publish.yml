name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run in dry-run mode (no actual publish)'
        required: false
        default: 'true'
        type: boolean

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # `bun run test` fans out to packages/compiler-rs, which needs its native
      # binding built from source before it can run.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler-rs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the native compiler
        run: bun run --cwd packages/compiler-rs build

      - name: Run lint and format check
        run: bun run ci

      - name: Build publishable packages
        run: |
          bun run --cwd packages/core build
          bun run --cwd packages/primitives build
          bun run --cwd packages/query build
          bun run --cwd packages/testing build

      - name: Run type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Verify build artifacts
        run: |
          for pkg in core primitives query testing; do
            echo "Checking packages/$pkg/dist..."
            ls -la packages/$pkg/dist/
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "Error: index.js not found in $pkg/dist"
              exit 1
            fi
            if [ ! -f "packages/$pkg/dist/index.d.ts" ]; then
              echo "Error: index.d.ts not found in $pkg/dist"
              exit 1
            fi
            echo "$pkg build verified"
          done

      - name: Publish @barqjs/core (dry-run)
        if: github.event.inputs.dry-run == 'true'
        working-directory: packages/core
        run: bun publish --dry-run --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/primitives (dry-run)
        if: github.event.inputs.dry-run == 'true'
        working-directory: packages/primitives
        run: bun publish --dry-run --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/query (dry-run)
        if: github.event.inputs.dry-run == 'true'
        working-directory: packages/query
        run: bun publish --dry-run --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/testing (dry-run)
        if: github.event.inputs.dry-run == 'true'
        working-directory: packages/testing
        run: bun publish --dry-run --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/core
        if: github.event.inputs.dry-run != 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/core
        run: bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/primitives
        if: github.event.inputs.dry-run != 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/primitives
        run: bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/query
        if: github.event.inputs.dry-run != 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/query
        run: bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @barqjs/testing
        if: github.event.inputs.dry-run != 'true' && startsWith(github.ref, 'refs/tags/v')
        working-directory: packages/testing
        run: bun publish --access public
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
