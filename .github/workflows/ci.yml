name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Format & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # BEFORE the lint step, not after it. `bun run ci` is oxlint --type-aware,
      # which resolves workspace imports through each package's dist — on a
      # clean runner those do not exist, every cross-package type widens to
      # `any`, and the run fails on no-unsafe-argument. Measured on a fresh
      # `git clone` + `bun install --frozen-lockfile`: 5 warnings before the
      # builds, 0 after. packages/compiler is built too, because
      # kitchen-sink's vite.config.ts imports @barqjs/compiler/vite and its
      # typecheck cannot resolve it otherwise.
      - name: Build packages (required for lint and typecheck)
        run: |
          bun run --cwd packages/core build
          bun run --cwd packages/extra build
          bun run --cwd packages/testing build
          bun run --cwd packages/compiler build

      - name: Run lint and format check
        run: bun run ci

      # NOT `bun run typecheck`. That one exits non-zero correctly — which is
      # the problem: it fails today on errors that predate this work, in
      # @barqjs/core and in its JSX type declarations.
      # The script runs each package on its own and diffs the result against
      # .github/typecheck-baseline.txt, so a new error fails the build and a
      # fixed one has to be struck off the list. Nothing is silenced: no
      # @ts-ignore, no skipped file, and the count is printed on every run.
      - name: Run type check
        run: .github/scripts/typecheck.sh

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/compiler-rs
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler-rs

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # index.js, index.d.ts and the .node binary are build artifacts, not
      # sources. Without this step packages/compiler-rs has no binding to test
      # against and its harness cannot even load.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/compiler-rs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the native compiler
        run: bun run --cwd packages/compiler-rs build

      # packages/compiler-rs/test/browser.test.ts renders the whole fixture
      # corpus in a real Chrome — both paths, driven through their steps and
      # events — plus the template parse conformance sweep and the O5 probes.
      # happy-dom has hidden three separate bug classes on this project already
      # (foster parenting, the tokenizer's NUL/CR rewriting, SVGElement
      # .className), so that suite is not optional. google-chrome-stable is
      # preinstalled on the ubuntu runner images; the checks FAIL rather than
      # skip when it is missing, so a runner image that drops it is visible
      # instead of silently disarming them.
      - name: Locate Chrome
        run: |
          CHROME=$(which google-chrome-stable || which google-chrome || which chromium)
          echo "using $CHROME"
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"

      # Its own step, and BEFORE the rest, so the per-fixture table lands in a
      # log section of its own and a regression is attributable to the commit
      # that caused it instead of buried in 300 lines of suite output. The
      # asserted gate is the pass-stage RATIO, which does not move with the
      # runner's speed — see the block at the bottom of throughput.test.ts.
      - name: Compile throughput
        run: bun test test/throughput.test.ts
        working-directory: packages/compiler-rs

      # Every package, no exclusions. `packages/extra` was excluded from M2 to
      # M8 while its migration was scheduled; M8 landed it, so the exclusion and
      # the informational second run that stood in for it are gone with it.
      - name: Run tests
        run: bun run test

      # The reference application is the acceptance test, and twice now a green
      # suite has not been able to see it. Its typecheck is not yet clean (the
      # JSX type layer has not moved to C1), so it reports rather than gates —
      # but it reports on every build instead of nowhere.
      - name: Reference application — typecheck (informational)
        continue-on-error: true
        run: bun run --cwd packages/kitchen-sink typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build publishable packages
        run: |
          bun run --cwd packages/core build
          bun run --cwd packages/extra build
          bun run --cwd packages/testing build

      - name: Verify package contents
        run: |
          for pkg in core extra testing; do
            echo "Checking packages/$pkg/dist..."
            ls -la packages/$pkg/dist/
            if [ ! -f "packages/$pkg/dist/index.js" ]; then
              echo "Error: index.js not found in $pkg/dist"
              exit 1
            fi
            if [ ! -f "packages/$pkg/dist/index.d.ts" ]; then
              echo "Error: index.d.ts not found in $pkg/dist"
              exit 1
            fi
          done
