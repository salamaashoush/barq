name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages/compiler
          shared-key: release-build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Lint and typecheck resolve workspace imports through each package's
      # dist and the native compiler's generated index.d.ts. On a clean runner
      # neither exists, cross-package types widen to `any`, and lint fails on
      # no-unsafe-argument and typecheck on TS2307.
      - name: Build packages
        run: bun run build:packages

      - name: Stray declarations, lint (warnings fail) and format
        run: bun run ci

      # Each package on its own, diffed against .github/typecheck-baseline.txt,
      # so a new error fails and a fixed one has to be struck off the list.
      - name: Typecheck packages
        run: .github/scripts/typecheck.sh

      - name: Typecheck the release scripts
        run: bun run typecheck:scripts

      # The registry is generated from src and shipped by @barqjs/ui; a
      # component edited without regenerating it ships the old copy.
      - name: The ui registry matches its sources
        run: |
          bun run --cwd packages/ui registry
          git diff --exit-code -- packages/ui/registry

  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/compiler
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages/compiler

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # packages/compiler's own suite runs fmt and clippy before its tests.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages/compiler
          shared-key: release-build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suites build Vite projects that resolve workspace packages through
      # their dist, the way an install does, and the native binding is a build
      # artifact the compiler's harness cannot load without.
      - name: Build packages
        run: bun run build:packages

      # packages/compiler/test/browser.test.ts renders the fixture corpus in
      # a real Chrome. happy-dom has hidden three bug classes on this project
      # (foster parenting, the tokenizer's NUL/CR rewriting, SVGElement
      # .className), so the browser checks fail rather than skip when Chrome
      # is missing. The ubuntu image ships google-chrome-stable.
      - name: Locate Chrome
        run: |
          chrome=$(command -v google-chrome-stable || command -v google-chrome || true)
          if [ -z "$chrome" ]; then
            echo "::error::no Chrome on this runner image"
            exit 1
          fi
          "$chrome" --version
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"

      # Every package, both engine builds: each package's `test` runs its suite
      # once as shipped and once under `--conditions=development`.
      - name: Run tests
        run: bun run test

      # Loads what the compiler emits for each dynamic prop and checks a signal
      # write reaches the DOM, so a benchmark case cannot time a dead binding.
      - name: Emitted bindings are live
        run: bun run --cwd packages/benchmark bench:shape

      - name: Reference application typechecks
        run: bun run --cwd packages/kitchen-sink typecheck

      # `bun test` compiles each module on its own; what breaks in an app is
      # the graph: a missing export condition, a style that reaches no element,
      # a module the bundler cannot resolve.
      - name: Build the apps
        run: bun run build:apps

  package-quality:
    name: Package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: packages/compiler
          shared-key: release-build

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build:packages

      # Packs every publishable package and checks the tarball: contents,
      # manifest, publint and Are the Types Wrong. Only this runner's native
      # binding exists here; the release dry run checks all of them.
      - name: Check every package as it would be published
        run: bun run pack:check
